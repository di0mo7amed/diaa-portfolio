# Dashboard settings (JSON is valid YAML)
{
 "backend": {
  "name": "github",
  "repo": "di0mo7amed/diaa-portfolio",
  "branch": "main"
 },
 "site_url": "https://bydiaa.online",
 "display_url": "https://bydiaa.online",
 "logo_url": "/img/logo.svg",
 "media_folder": "img/uploads",
 "public_folder": "/img/uploads",
