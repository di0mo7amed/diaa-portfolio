# Dashboard settings (JSON is valid YAML)
{
 "backend": {
  "name": "github",
  "repo": "di0mo7amed/diaa-portfolio",
  "branch": "main"
 },
 "site_url": "https://bydiaa.online",
 "display_url": "https://bydiaa.online",
 "logo_url": "/img/logo.svg",
 "media_folder": "img/uploads",
 "public_folder": "/img/uploads",
 "collections": [
  {
   "name": "projects",
   "label": "Campaigns",
   "label_singular": "Campaign",
   "folder": "content/projects",
   "extension": "json",
   "format": "json",
   "create": true,
   "delete": true,
   "identifier_field": "slug",
   "slug": "{{fields.slug}}",
   "summary": "{{order}} · {{name.en}}",
   "sortable_fields": [
    "order",
    "name.en",
    "year"
   ],
   "fields": [
    {
     "label": "Order on the site",
     "name": "order",
     "widget": "number",
     "value_type": "int",
     "default": 99,
     "hint": "1 shows first (shared with the other collection)."
    },
    {
     "label": "Hide from the site",
     "name": "hidden",
     "widget": "boolean",
     "required": false,
     "default": false
    },
    {
     "label": "Page address (English letters, no spaces)",
     "name": "slug",
     "widget": "string",
     "pattern": [
      "^[a-z0-9-]+$",
      "lowercase letters, numbers and - only"
     ]
    },
    {
     "label": "Name",
     "name": "name",
     "widget": "object",
     "required": true,
     "collapsed": false,
     "fields": [
      {
       "label": "English",
       "name": "en",
       "widget": "string",
       "required": false
      },
      {
       "label": "عربي",
       "name": "ar",
       "widget": "string",
       "required": false
      }
     ]
    },
    {
     "label": "Field / industry",
     "name": "field",
     "widget": "object",
     "required": false,
     "collapsed": false,
     "fields": [
      {
       "label": "English",
       "name": "en",
       "widget": "string",
       "required": false
      },
      {
       "label": "عربي",
       "name": "ar",
       "widget": "string",
       "required": false
      }
     ]
    },
    {
     "label": "Year",
     "name": "year",
     "widget": "string"
    },
    {
     "label": "Filters",
     "name": "tags",
     "widget": "select",
     "multiple": true,
     "required": false,
     "options": [
      {
       "label": "Social Media",
       "value": "social"
      },
      {
       "label": "Campaigns",
       "value": "campaigns"
      },
      {
       "label": "Art Direction",
       "value": "art"
      }
     ],
     "default": [
      "social"
     ]
