  {
   "name": "projects",
   "label": "Projects",
   "label_singular": "Project",
   "folder": "content/projects",
   "extension": "json",
   "format": "json",
   "create": true,
   "delete": true,
   "identifier_field": "slug",
   "slug": "{{fields.slug}}",
   "summary": "{{order}} · {{name.en}}",
   "sortable_fields": [
    "order"
   ],
   "fields": [
    {
     "label": "Order on the site",
     "name": "order",
     "widget": "number",
     "value_type": "int",
     "default": 99,
     "hint": "1 shows first."
    },
    {
     "label": "Hide from the site",
     "name": "hidden",
     "widget": "boolean",
     "required": false,
     "default": false
    },
    {
     "label": "Page address (English letters, no spaces)",
     "name": "slug",
     "widget": "string",
     "pattern": [
      "^[a-z0-9-]+$",
      "lowercase letters, numbers and - only"
     ],
     "hint": "e.g. hbbah → project-hbbah.html"
    },
    {
     "label": "Name",
     "name": "name",
     "widget": "object",
     "collapsed": false,
     "fields": [
      {
       "label": "English",
       "name": "en",
       "widget": "string",
       "required": true
